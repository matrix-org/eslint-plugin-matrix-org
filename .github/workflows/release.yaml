name: Release Automation
on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: The scale of the version bump required for semver compatibility
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
concurrency: release
jobs:
  release:
    name: "Release & Publish"
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing with OIDC
    steps:
      - name: 🧮 Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
      - name: 🔧 Set up node environment
        uses: actions/setup-node@v3
        with:
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false  # never use caching in release builds

      - name: 🛠️ Setup
        run: pnpm ci

      - name: 👊 Bump version
        run: |
          pnpm version --no-git-tag-version ${{ github.event.inputs.version-bump }}
          git config --global user.name 'ElementRobot'
          git config --global user.email 'releases@riot.im'
          git commit -am "${{ github.event.inputs.version-bump }} version bump"
          git push

      - name: 🚀 Publish to npm
        run: pnpm publish --access public --provenance

      - name: 🧬 Create release
        run: gh release create "$tag_name" --title "$release_name" --notes "$body" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          tag_name: v${{ steps.npm-publish.outputs.version }}
          release_name: Release ${{ steps.npm-publish.outputs.version }}
          body: ${{ steps.npm-publish.outputs.version }} Release
